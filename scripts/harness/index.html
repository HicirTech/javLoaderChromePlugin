<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>rendering</title>
    <style>
      html, body { margin: 0; padding: 0; }
      body > div { width: max-content; }
      /* Virtual time does not advance CSS transitions, so a screenshot would
         freeze every animated property at its starting value: a checked radio
         still at scale(0), a button still painted disabled. */
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./harness.js"></script>
  </body>
</html>
